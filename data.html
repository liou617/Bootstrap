<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>讀取政府公開資料顯示</title>
</head>

<body>

    <div class="container">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const dataURL = "./data.json";
        let data;



        getData();

        // await 等待回傳結果是promise的格式 
        // 只能放在 async 宣告的function中，或是再modal型式的script 標籤下
        async function getData() {

            // 抓資料
            try {
                const respone = await fetch(dataURL);
                if (respone.result >= 300) {
                    // return console.log("有錯誤");
                    throw new Error(respone.statusText);

                }

                const result = await respone.json();
                data = structuredClone(result);

            } catch (err) {
                console.log(err);

            }

        }
        // 處理資料
        function init() {
            console.log("開始處理視覺");
            console.log(data);

        }

    </script>
</body>

</html>
