<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .w200px {
            width: 200px;
        }
    </style>
    <title>由程式才能補完的組件</title>
</head>

<body>
    <div class="container">
        <button type="button" class="btn btn-primary btn-open">
            Launch demo modal
        </button>
        <hr>
        <!-- class="object-fit-cover" 等比顯示圖片但會裁切 -->
        <div class="w200px ratio ratio-1x1">
            <img class="object-fit-cover" src="https://img.youtube.com/vi/Ig6u1WxnaQo/maxresdefault.jpg" alt="">
        </div>
        <hr>
        <div class="w200px ratio ratio-4x3 mt-3">
            <img class="object-fit-cover" src="https://img.youtube.com/vi/Ig6u1WxnaQo/maxresdefault.jpg" alt="">
        </div>
        <hr>
        <div class="w200px ratio ratio-16x9 mt-3">
            <img class="object-fit-cover" src="https://img.youtube.com/vi/Ig6u1WxnaQo/maxresdefault.jpg" alt="">
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const btnOpen = document.querySelector(".btn-open");
        const myModalElm = document.querySelector("#exampleModal");
        const myModalBody = document.querySelector("#exampleModal .modal-body");
        const myModal = new bootstrap.Modal("#exampleModal", {});


        btnOpen.addEventListener("click", () => {
            showModal(`<iframe width="100%" height="315"
                        src="https://www.youtube.com/embed/Ig6u1WxnaQo?si=72qsuNHH8syFylp9" title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`);
        });

        myModalElm.addEventListener("hidden.bs.modal", () => {
            myModalBody.innerHTML = "";
        });
        // 先寫內容再開啟
        function showModal(content) {
            myModalBody.innerHTML = content;
            myModal.show();
        }
    </script>
</body>

</html>
