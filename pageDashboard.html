<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        html,
        body {
            /* min-height: 100%; */
            /* min 無法作為百分比的依據所以無效 */
            height: 100%;
        }

        .w250px {
            width: 250px;
        }
    </style>
    <title>dashboard</title>
</head>

<body class="d-flex">
    <nav id="collapseWidthExample" class="h-100 collapse collapse-horizontal bg-secondary-subtle show">
        <div class="w250px p-2">
            <div class="d-flex">
                <button type="button" class="btn-close ms-auto" aria-label="Close" data-bs-toggle="collapse"
                    data-bs-target="#collapseWidthExample"></button>
            </div>
            <button class="btn btn-primary w-100" data-bs-target="#content1" data-bs-toggle="collapse">選項 1</button>
            <div id="content1" class="collapse">
                <div class="card">
                    <div class="card-body d-grid gap-1">
                        <button class="btn btn-sm btn-primary">選項 1-1</button>
                        <button class="btn btn-sm btn-primary">選項 1-2</button>
                    </div>
                </div>
            </div>
            <div class="btn-group-vertical w-100 mt-2">
                <button class="btn btn-primary">選項2</button>
                <!-- data-bs-target="#content2" data-bs-target="#content2"控制向id與執行動作id -->
                <button data-bs-target="#content2" data-bs-toggle="collapse" class="btn btn-primary">選項3</button>
                <div class="collapse w-100" id="content2">
                    <div class="card d-grid gap-1 p-1 rounded-0">
                        <button class="btn btn-sm btn-primary">選項3-1</button>
                        <button class="btn btn-sm btn-primary">選項3-2</button>
                        <button class="btn btn-sm btn-primary">選項3-3</button>
                    </div>

                </div>
                <button class="btn btn-primary">選項4</button>
                <div class="btn-group dropend">
                    <button data-bs-toggle="dropdown" class="btn btn-primary dropdown-toggle">選項 5</button>
                    <ul class="dropdown-menu">
                        <!-- dropdown自有下拉屬性不需要target -->
                        <li><a class="dropdown-item " href="#">選項5-1</a></li>
                        <li><a class="dropdown-item " href="#">選項5-2</a></li>
                        <li><a class="dropdown-item " href="#">選項5-3</a></li>
                    </ul>
                </div>
                <button class="btn btn-primary">選項6</button>
            </div>
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <!-- collapsed預設關閉 -->
                        <button style="--bs-focus-ring-color: rgba(var(--bs-success-rgb), .25)"
                            class="accordion-button collapsed bg-warning focus-ring" type="button"
                            data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true"
                            aria-controls="collapseOne">
                            Accordion Item #1
                        </button>
                    </h2>
                    <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            取消focus-ring
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button bg-warning" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                            Accordion Item #2
                        </button>
                    </h2>
                    <!-- show 內容預設展開 -->
                    <div id="collapseTwo" class="accordion-collapse collapse  show" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            ...
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed bg-warning" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                            Accordion Item #3
                        </button>
                    </h2>
                    <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            ...
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </nav>
    <!-- flex-fill 向下佔滿剩下區域 -->
    <main class="flex-fill p-3">
        <button class="btn btn-primary mb-3" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseWidthExample" aria-expanded="false" aria-controls="collapseWidthExample">
            Toggle width collapse
        </button>
        <ul class="nav nav-tabs ps-3" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane"
                    type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">Home</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane"
                    type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">Profile</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane"
                    type="button" role="tab" aria-controls="contact-tab-pane" aria-selected="false">Contact</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="disabled-tab" data-bs-toggle="tab" data-bs-target="#disabled-tab-pane"
                    type="button" role="tab" aria-controls="disabled-tab-pane" aria-selected="false"
                    disabled>Disabled</button>
            </li>
        </ul>
        <div class="tab-content border border-top-0" id="myTabContent">
            <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab"
                tabindex="0">Home 內容要全部都載入到 HTML 中</div>

            <div class="card text-center mt-3">
                <div class="card-header">
                    <ul class="nav nav-tabs card-header-tabs">
                        <li class="nav-item">
                            <a class="nav-link fetch-user" data-file="file1.html" href="#" aria-current="true">檔案1</a>
                        </li>
                        <li class="nav-item">
                            <!-- active預設開啟頁面 -->
                            <a class="nav-link fetch-user active" data-file="myFile.html" href="#">檔案2</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                </div>
                <div class="card-body display-area">
                    <h5 class="card-title">Special title treatment</h5>
                    <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                    <a class="btn btn-primary">Go somewhere</a>
                </div>
            </div>
            <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
                Profile</div>
            <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">
                Contact</div>
            <div class="tab-pane fade" id="disabled-tab-pane" role="tabpanel" aria-labelledby="disabled-tab"
                tabindex="0">反正也切不過去</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const linkFetchUsers = document.querySelectorAll(".fetch-user");
        const displayArea = document.querySelector(".display-area");


        linkFetchUsers.forEach(link => {
            link.addEventListener("click", fetchData);
        });
        linkFetchUsers[0].click();

        function fetchData(event) {
            event.preventDefault();
            loading()
            const filePath = event.target.dataset.file;
            fetch(filePath, {
                method: 'get'
            }).then((response) => {
                // 主機的回應
                // 主機有時會回應 404 等錯誤, 有些錯誤會進到 catch 有些不會
                console.log(response.status);
                if (response.status >= 200 && response.status < 300) {
                    return response.text();
                }
                throw new Error("錯誤產生 " + response.statusText);
            }).then((data) => {
                // 處理後續內容
                return;
                console.log(data);
                displayArea.innerHTML = data;
                document.querySelector(".fetch-user.active").classList.remove("active");
                event.target.classList.add("active");

            }).catch(function (error) {
                console.log(error);
                // 補獲錯誤
            });
        }

        function loading() {
            displayArea.innerHTML`<div class="spinner-border text-info" role="status">
                                 <span class="visually-hidden">Loading...</span>
                                </div>`
        }

    </script>
</body>

</html>
