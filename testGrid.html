<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        html,
        body {
            height: 100%;
        }

        .box {
            background-color: #8909d37a;
            height: 100px;
            margin-bottom: 10px;
        }

        .h100px {
            height: 100px;
        }
    </style>
    <title>測試欄位系統</title>
</head>

<body>

    <div class="container mb-5">
        <div class="row row-cols-4 gx-2 gy-1">
            <div class="col">
                <div class="bg-primary h100px">1</div>
            </div>
            <div class="col">
                <div class="bg-primary h100px">2</div>
            </div>
            <div class="col">
                <div class="bg-primary h100px">3</div>
            </div>
            <div class="col">
                <div class="bg-primary h100px">4</div>
            </div>
            <div class="col">
                <div class="bg-primary h100px">5</div>
            </div>
            <div class="col">
                <div class="bg-primary h100px">6</div>
            </div>
        </div>




    </div>
    <div class="container mb-3">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 ">
            <!--row-cols-(4) 控制欄位數 -->
            <div class="col">
                <div class="box">1</div>
            </div>
            <div class="col">
                <div class="box">2</div>
            </div>
            <div class="col">
                <div class="box">3</div>
            </div>
            <div class="col">
                <div class="box">4</div>
            </div>
            <div class="col">
                <div class="box">5</div>
            </div>
            <div class="col">
                <div class="box">6</div>
            </div>
        </div>


    </div>
    <div class="container mb-5">
        <!-- mb 下排增加間距 -->
        <div class="row">
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">
                <div class="box">1</div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-8">
                <div class="box">2</div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-9">
                <div class="box">3</div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-3">
                <div class="box">4</div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-6">
                <div class="box">5</div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-6">
                <div class="box">6</div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <div class="box">1</div>
            </div>
            <div class="col-4">
                <div class="box">2</div>
            </div>
            <div class="col-7">
                <div class="box">3</div>
            </div>
            <div class="col-5">
                <div class="box">4</div>
            </div>
            <div class="col-5">
                <div class="box">5</div>
            </div>
            <div class="col-2">
                <div class="box">6</div>
            </div>
        </div>
    </div>


    <div class="container h-50">
        <div class="row h-100">
            <div class="col-2">
                <div class="bg-primary h-100"></div>
            </div>
            <div class="col">
                <div class="bg-primary h-100"></div>
            </div>
        </div>
    </div>
    <div class="container h-50">
        <div class="row h-100">
            <div class="col-4">
                <div class="bg-info h-100"></div>
            </div>
            <div class="col">
                <div class="bg-info h-100"></div>
            </div>
        </div>
    </div>
    <!-- .container.h-50>.row.h-100>.col-4*3>.bg-warning.h-100 -->
    <div class="container h-50">
        <div class="row h-100">
            <div class="col-4">
                <div class="bg-warning h-100"></div>
            </div>
            <div class="col-4">
                <div class="bg-warning h-100"></div>
            </div>
            <div class="col-4">
                <div class="bg-warning h-100"></div>
            </div>
        </div>
    </div>
    <div class="container h-50">
        <div class="row h-100">
            <div class="col h-100">
                <div class="bg-primary h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-primary h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-primary h-100"></div>
            </div>
        </div>
    </div>
    <!-- .container.h-100>.row.h-100>.col*12.h-100>.bg-danger.h-100 -->
    <div class="container h-100">
        <div class="row h-100">
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
            <div class="col h-100">
                <div class="bg-danger h-100"></div>
            </div>
        </div>
    </div>
    <!-- <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
        </div>
    </div> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
