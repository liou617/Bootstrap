<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title></title>
</head>

<body>
    <!-- 觸發按鈕 -->
    <div class="container pt-3">
        <button class="btn btn-primary btn-add"> alert++ </button>
    </div>
    <!-- 觸發容器設計 -->
    <div class="container-fluid alert-container w-25 h-100 position-fixed end-0 top-0
        d-flex flex-column-reverse justify-content-start">
        <!-- <div class="alert alert-warning alert-dismissible fade show" role="alert">
            {}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div> -->

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const btnAdd = document.querySelector(".btn-add");
        const alertContainer = document.querySelector(".alert-container");
        let alertNum = 0;

        btnAdd.addEventListener("click", function () {
            alertNum++;
            // createElement只能放標籤
            const node = document.createElement("div");
            node.className = "alert alert-warning alert-dismissible fade show";
            node.innerHTML = `${alertNum}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;

            alertContainer.append(node);
        });
    </script>
</body>

</html>
